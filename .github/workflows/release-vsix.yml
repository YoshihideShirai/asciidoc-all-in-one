name: Release VSIX

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: GitHub release tag to upload the VSIX to
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload-vsix:
    name: Build and upload VSIX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests and audits
        run: xvfb-run -a npm test

      - name: Package VSIX
        run: npm run package:vsix

      - name: Upload VSIX to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}
        run: gh release upload "$RELEASE_TAG" ./*.vsix --clobber
